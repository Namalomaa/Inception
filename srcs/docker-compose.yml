services:

  mariadb:

    image: mariadb:inception

    build:
      context: ./requirements/mariadb

    container_name: mariadb

    restart: always

    secrets:
      - db_root_pass
      - db_pass

    env_file:
      - .env

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - inception

    expose:
      - "3306"

  wordpress:

    image: wordpress:inception

    build:
      context: ./requirements/wordpress

    container_name: wordpress
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy

    env_file:
      - .env
    
    secrets:
      - db_pass
      - wp_admin_pass
      - wp_user_pass

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - inception

  nginx:
    image: nginx:inception

    build:
      context: ./requirements/nginx

    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html:ro

secrets:

  db_root_pass:
    file: ../secrets/db_root_pass.txt
  
  db_pass:
    file: ../secrets/db_pass.txt

  wp_admin_pass:
    file: ../secrets/wp_admin_pass.txt

  wp_user_pass:
    file: ../secrets/wp_user_pass.txt

volumes:

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/namaloma/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/namaloma/data/wordpress

networks:

  inception:
    name: inception
    driver: bridge
